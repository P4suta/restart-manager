name: Dependency policy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  required:
    name: Dependency policy required
    if: always()
    needs:
      - cargo-deny
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Reject an unsuccessful or missing dependency-policy result
        if: >-
          needs.cargo-deny.result != 'success' ||
          (github.event_name == 'pull_request' && needs.dependency-review.result != 'success') ||
          (github.event_name != 'pull_request' && needs.dependency-review.result != 'skipped')
        shell: bash
        run: exit 1
      - name: Confirm the dependency policy succeeded
        run: echo "The dependency policy succeeded."
