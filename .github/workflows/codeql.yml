name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 3 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.37.4
