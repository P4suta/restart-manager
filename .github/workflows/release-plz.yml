# `publish = false` in release-plz.toml limits release-plz to preparing the pull request.
# Tagging, publication, and attestation stay in release.yml.
name: Release-plz release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare a human-reviewed release PR
    if: >-
      github.repository_id == '1319905206' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release-plz
    permissions:
      contents: read # The App token authorizes writes under docs/adr/sync-release-app-credentials-to-the-protected-environment.md.
    env:
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_APP_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_APP_CLIENT_ID, '${') &&
        secrets.RELEASE_APP_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_APP_PRIVATE_KEY, '${') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Reject missing or unresolved automation credentials
        if: env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - id: app-token
        name: Create a repository-scoped release App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: restart-manager
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the release PR
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
