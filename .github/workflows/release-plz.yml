# The upstream-recommended release-plz release-pr workflow. The one deviation,
# which release-plz also documents, is the GitHub App token: the default
# GITHUB_TOKEN cannot trigger other workflows, so CI would never run on a
# release pull request.
#
# `publish = false` in release-plz.toml keeps release-plz limited to preparing
# the pull request. Tagging, publication, and attestation stay in release.yml.
name: Release-plz release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare a human-reviewed release PR
    if: >-
      github.repository == 'P4suta/restart-manager' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release-plz
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
      - name: Fetch automation credentials
        id: doppler_automation_2
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: restart-manager
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_2.outcome == 'success' && (
          steps.doppler_automation_2.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_2.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_2.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_2.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - id: app-token
        name: Create a repository-scoped release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.doppler_automation_2.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_2.outputs.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: restart-manager
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update the release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
