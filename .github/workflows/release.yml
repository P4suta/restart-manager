name: Release verification and dormant publishing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after protected-environment approval
        type: boolean
        required: true
        default: false
      trusted_publishing:
        description: Use crates.io Trusted Publishing after bootstrap
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
      archive_path: ${{ steps.package.outputs.archive_path }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      checksum_name: ${{ steps.package.outputs.checksum_name }}
      sbom_name: ${{ steps.package.outputs.sbom_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - id: package
        name: Verify tag, manifest, lockfile, and changelog
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          $arguments = @{
            GitHubOutput = $env:GITHUB_OUTPUT
          }
          if ($env:REF_TYPE -eq 'tag' -or $env:PUBLISH -eq 'true') {
            $arguments.ExpectedTag = $env:REF_NAME
            $arguments.RequireRelease = $true
          }
          if ($env:REF_TYPE -eq 'tag') {
            $arguments.RequireAnnotatedTag = $true
          }
          if ($env:PUBLISH -eq 'true' -and $env:REF_TYPE -ne 'tag') {
            throw 'publishing is allowed only when workflow_dispatch targets a tag'
          }
          & ./.github/scripts/release-metadata.ps1 @arguments
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked -- --test-threads=1
      - run: cargo test --doc --all-features --locked
      - run: cargo run --locked --package xtask -- e2e
      - run: cargo package --locked
      - name: Record package allowlist and digest
        shell: pwsh
        run: |
          cargo package --list --locked | Set-Content package-files.txt
          (Get-FileHash "${{ steps.package.outputs.archive_path }}" -Algorithm SHA256).Hash |
            Set-Content "${{ steps.package.outputs.checksum_name }}"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.package.outputs.archive_path }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom_name }}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.package.outputs.archive_path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_name }}
            ${{ steps.package.outputs.sbom_name }}
            package-files.txt

  publish-token-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.trusted_publishing
    needs: verify
    runs-on: windows-2022
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
      - id: package
        name: Re-verify release metadata
        shell: pwsh
        run: >-
          ./.github/scripts/release-metadata.ps1
          -ExpectedTag "${{ github.ref_name }}"
          -RequireRelease
          -RequireAnnotatedTag
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: verified
      - name: Reproduce and compare verified package
        shell: pwsh
        run: |
          cargo package --locked
          $actual = (Get-FileHash "${{ steps.package.outputs.archive_path }}" -Algorithm SHA256).Hash
          $expected = (Get-Content "verified/${{ needs.verify.outputs.checksum_name }}").Trim()
          if ($actual -ne $expected) { throw "verified package digest mismatch" }
      - name: First-publication bootstrap only
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  publish-trusted:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.trusted_publishing
    needs: verify
    runs-on: windows-2022
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
      - id: package
        name: Re-verify release metadata
        shell: pwsh
        run: >-
          ./.github/scripts/release-metadata.ps1
          -ExpectedTag "${{ github.ref_name }}"
          -RequireRelease
          -RequireAnnotatedTag
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: verified
      - name: Reproduce and compare verified package
        shell: pwsh
        run: |
          cargo package --locked
          $actual = (Get-FileHash "${{ steps.package.outputs.archive_path }}" -Algorithm SHA256).Hash
          $expected = (Get-Content "verified/${{ needs.verify.outputs.checksum_name }}").Trim()
          if ($actual -ne $expected) { throw "verified package digest mismatch" }
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Trusted publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
