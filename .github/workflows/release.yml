name: Release verification and dormant publishing

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after protected-environment approval
        type: boolean
        required: true
        default: false
      trusted_publishing:
        description: Use crates.io Trusted Publishing after bootstrap
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - name: Verify tag, manifest, lockfile, and changelog agree
        shell: pwsh
        run: |
          $manifest = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$'
          $version = $manifest.Matches[0].Groups[1].Value
          $lockPattern = 'version = "{0}"' -f $version
          if (-not (Select-String -Quiet -Path Cargo.lock -Pattern $lockPattern)) {
            throw "Cargo.lock does not contain package version $version"
          }
          if (-not (Select-String -Quiet -Path CHANGELOG.md -Pattern "^## \[$version\]")) {
            throw "CHANGELOG has no top-level entry for $version"
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match v$version"
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked -- --test-threads=1
      - run: cargo test --doc --all-features --locked
      - run: cargo run --locked --package xtask -- e2e
      - run: cargo package --locked
      - name: Record package allowlist and digest
        shell: pwsh
        run: |
          cargo package --list --locked | Set-Content package-files.txt
          (Get-FileHash target/package/restart-manager-1.0.0.crate -Algorithm SHA256).Hash |
            Set-Content restart-manager-1.0.0.crate.sha256
      - uses: anchore/sbom-action@v0.24.0
        with:
          path: target/package/restart-manager-1.0.0.crate
          format: spdx-json
          output-file: restart-manager-1.0.0.spdx.json
      - uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: target/package/restart-manager-1.0.0.crate
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-restart-manager-1.0.0
          path: |
            target/package/restart-manager-1.0.0.crate
            restart-manager-1.0.0.crate.sha256
            restart-manager-1.0.0.spdx.json
            package-files.txt

  publish-token-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.trusted_publishing
    needs: verify
    runs-on: windows-2022
    environment: crates-io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-restart-manager-1.0.0
          path: verified
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reproduce and compare verified package
        shell: pwsh
        run: |
          cargo package --locked
          $actual = (Get-FileHash target/package/restart-manager-1.0.0.crate -Algorithm SHA256).Hash
          $expected = (Get-Content verified/restart-manager-1.0.0.crate.sha256).Trim()
          if ($actual -ne $expected) { throw "verified package digest mismatch" }
      - name: First-publication bootstrap only
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  publish-trusted:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.trusted_publishing
    needs: verify
    runs-on: windows-2022
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-restart-manager-1.0.0
          path: verified
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Reproduce and compare verified package
        shell: pwsh
        run: |
          cargo package --locked
          $actual = (Get-FileHash target/package/restart-manager-1.0.0.crate -Algorithm SHA256).Hash
          $expected = (Get-Content verified/restart-manager-1.0.0.crate.sha256).Trim()
          if ($actual -ne $expected) { throw "verified package digest mismatch" }
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Trusted publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
