name: Doppler secret import

on:
  pull_request:
    paths:
      - '.github/doppler-import/**'
      - '.github/workflows/doppler-secret-import.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: doppler-secret-import-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/doppler-import
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.15
          working_directory: .github/doppler-import
          install_args: rust
          cache: false
          env: false
      - run: mise x rust -- cargo fmt --check
      - run: mise x rust -- cargo clippy --locked --all-targets -- -D warnings
      - run: mise x rust -- cargo test --locked

  transfer:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1319905206' && github.ref == 'refs/heads/doppler-secret-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment: 'crates-io'
    defaults:
      run:
        working-directory: .github/doppler-import
    steps:
      - name: Check out the dispatched commit without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.15
          working_directory: .github/doppler-import
          install_args: rust
          cache: false
          env: false
      - name: Build before injecting selected credentials
        run: mise x rust -- cargo build --locked
      - name: Transfer to the fixed Doppler config and compare privately
        run: target/debug/doppler-transfer
        env:
          DOPPLER_MIGRATION_TOKEN: ${{ secrets.DOPPLER_MIGRATION_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
